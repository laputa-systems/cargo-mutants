name: release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  preflight:
    name: Validate release ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default_branch: ${{ steps.ref.outputs.default_branch }}
    steps:
      - name: Require the default branch
        id: ref
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" ]]; then
            echo "Release dispatch rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          echo "default_branch=$default_branch" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - run: cargo test --locked --all-features

  build:
    name: Build (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset: cargo-mutants-x86_64-unknown-linux-musl-static
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset: cargo-mutants-aarch64-unknown-linux-musl-static
          - runner: macos-latest
            target: x86_64-apple-darwin
            asset: cargo-mutants-x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset: cargo-mutants-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
      - name: Build release
        run: cargo build --locked --release --bin cargo-mutants --target "${{ matrix.target }}"
      - name: Package binary
        run: install -m 755 "target/${{ matrix.target }}/release/cargo-mutants" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create pre-release
    needs: [preflight, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recheck release ref and tag
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ needs.preflight.outputs.default_branch }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          default_branch=$(gh api "repos/$REPOSITORY" --jq '.default_branch')
          if [[ "$EVENT_NAME" != workflow_dispatch || "$REF" != "refs/heads/$default_branch" || "$DEFAULT_BRANCH" != "$default_branch" ]]; then
            echo "Release publication rejected: expected workflow_dispatch on refs/heads/$default_branch, got $EVENT_NAME on $REF" >&2
            exit 1
          fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release publication rejected: tag $RELEASE_TAG already exists" >&2
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cargo-mutants-*
          path: dist
          merge-multiple: true
      - name: Verify release artifacts
        run: |
          set -euo pipefail
          expected=$(printf '%s\n' \
            cargo-mutants-aarch64-apple-darwin \
            cargo-mutants-aarch64-unknown-linux-musl-static \
            cargo-mutants-x86_64-apple-darwin \
            cargo-mutants-x86_64-unknown-linux-musl-static | LC_ALL=C sort)
          actual=$(find dist -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          if [[ "$actual" != "$expected" ]]; then
            echo "Unexpected release artifacts:" >&2
            printf '%s\n' "$actual" >&2
            exit 1
          fi
          for binary in dist/cargo-mutants-*-unknown-linux-musl-static; do
            readelf -h "$binary" >/dev/null
            if readelf -lW "$binary" | grep -q INTERP; then
              echo "$binary has a dynamic ELF interpreter" >&2
              exit 1
            fi
            if readelf -dW "$binary" | grep -q NEEDED; then
              echo "$binary has a dynamic library dependency" >&2
              exit 1
            fi
          done
      - name: Archive and checksum artifacts
        run: |
          set -euo pipefail
          for binary in dist/cargo-mutants-*; do
            chmod 755 "$binary"
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cJf "$binary.tar.xz" -C dist "$(basename "$binary")"
          done
          cd dist
          sha256sum *.tar.xz | LC_ALL=C sort -k2 > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 \
            --json tagName --jq '.[0].tagName // ""')
          if [[ -z "$previous" ]]; then
            printf 'Initial release at %s.\n' "$GITHUB_SHA" > "$notes"
            exit 0
          fi
          compare="repos/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_SHA"
          status=$(gh api "$compare" --jq '.status')
          if [[ "$status" != ahead ]]; then
            printf 'Release notes rejected: %s is %s relative to %s, expected ahead\n' "$GITHUB_SHA" "$status" "$previous" >&2
            exit 1
          fi
          {
            printf '## Changes since %s\n\n' "$previous"
            gh api --paginate "$compare?per_page=100" --jq '.commits[] | "- \(.sha[0:12]) \(.commit.message | split("\n")[0])"'
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$previous" "$GITHUB_SHA"
          } > "$notes"
      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: release-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.tar.xz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --prerelease \
            --notes-file "$RUNNER_TEMP/release-notes.md" --target "$GITHUB_SHA" --title "$RELEASE_TAG"
